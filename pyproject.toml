[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameday"
version = "0.1.0"
description = "NFL game-day player forecaster: per-position quantile models with weather, opponent quality, and buzz signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.26",
    "typer>=0.9",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2",            # neural quantile nets; fits comfortably in 8GB VRAM
]
social = [
    "praw>=7.7",             # Reddit ingestion for the buzz signal
]
agent = [
    # Draft chat agent (/api/chat). Optional: the dashboard serves fine without
    # it, and the chat panel reports itself unavailable. Also needs the Claude
    # Code CLI on the host — the SDK drives it as a subprocess.
    "claude-agent-sdk>=0.2",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
gameday = "gameday.cli:app"

[tool.setuptools.packages.find]
include = ["gameday*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

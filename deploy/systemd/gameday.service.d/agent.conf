# Drop-in enabling the draft chat agent on the gameday service.
#
# Install to ~/.config/systemd/user/gameday.service.d/agent.conf, then
# `systemctl --user daemon-reload && systemctl --user restart gameday`.
#
# Two things the base unit doesn't provide:
#
#   PATH        The Claude Code CLI lives in ~/.local/bin, which a systemd user
#               unit does not inherit — it gets a minimal PATH, not a login
#               shell's. The SDK spawns the CLI as a subprocess, so without this
#               the agent reports "the `claude` CLI was not found".
#
#   Credentials Kept in a separate file, mode 600, deliberately NOT in the repo.
#               The leading `-` makes it optional: if the file is absent the
#               service still starts and the chat panel reports itself
#               unavailable rather than the dashboard failing to boot.
#
# Create the credential file with:
#
#   mkdir -p ~/.config/gameday && chmod 700 ~/.config/gameday
#   claude setup-token          # prints a long-lived token
#   printf 'CLAUDE_CODE_OAUTH_TOKEN=%s\n' '<token>' > ~/.config/gameday/agent.env
#   chmod 600 ~/.config/gameday/agent.env
#
# Subscription auth is for the owner of the subscription. If this app is ever
# opened to other people, put ANTHROPIC_API_KEY in that file instead — the
# session manager prefers whichever is set and needs no code change.

[Service]
Environment=PATH=%h/.local/bin:/usr/local/bin:/usr/bin:/bin
EnvironmentFile=-%h/.config/gameday/agent.env
